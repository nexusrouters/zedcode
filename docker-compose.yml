services:
  zedcode:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zedcode
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/zedcode:/home/zedcode/.config/zedcode
      - ./data/opencode/share:/home/zedcode/.local/share/opencode
      - ./data/opencode/state:/home/zedcode/.local/state/opencode
      - ./data/opencode/config:/home/zedcode/.config/opencode
      - ./data/ssh:/home/zedcode/.ssh
      - ./workspaces:/home/zedcode/workspaces
    environment:
      # Docker binds ZedCode to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   ZEDCODE_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      ZEDCODE_UI_PASSWORD: ${ZEDCODE_UI_PASSWORD:?Set ZEDCODE_UI_PASSWORD before exposing ZedCode through Docker}
    # ZEDCODE_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # ZEDCODE_TUNNEL_PROVIDER: cloudflare
    # ZEDCODE_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # ZEDCODE_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # ZEDCODE_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # ZEDCODE_TUNNEL_CONFIG: /home/zedcode/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # ZEDCODE_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
